name: CI/CD Pipeline

on:
  push:
    branches:
      - Muñoz

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run tests
      run: pytest test_app.py -v
    
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build & Push image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/bcspndamianc/flask-cicd-project:munoz-1.0.5

    - name: Crear carpeta en el VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          mkdir -p ~/munoz-stack

    - name: 📋 Copiar docker-compose.yml al VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "docker-compose.yml"
        target: "/home/${{ secrets.VPS_USERNAME }}/munoz-stack"

    - name: 🚀 Deploy to VPS (docker-compose)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          cd ~/munoz-stack
          
          echo "Iniciando sesión en GHCR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u bcspndamianc --password-stdin
          
          echo "Descargando última imagen"
          docker pull ghcr.io/bcspndamianc/flask-cicd-project:munoz-1.0.5
          
          echo "Levantando servicios"
          docker-compose down
          docker-compose up -d
          
          docker ps
